// Mapa wektorowa OpenFreeMap przemalowana na kolory zbliżone do Google (eksperymentalna)
function googleize(m){
  const C={bg:'#f5f3ee',water:'#aadaff',park:'#c9e8c0',build:'#e9e5dc',hw:'#fdd88a',road:'#ffffff',casing:'#e0dcd2'};
  m.getStyle().layers.forEach(l=>{
    const id=l.id,t=l.type;
    try{
      if(t==='background')m.setPaintProperty(id,'background-color',C.bg);
      else if(t==='fill'&&/water/i.test(id))m.setPaintProperty(id,'fill-color',C.water);
      else if(t==='fill'&&/park|wood|forest|grass|green|garden|pitch|cemetery|nature/i.test(id))m.setPaintProperty(id,'fill-color',C.park);
      else if(t==='fill'&&/building/i.test(id))m.setPaintProperty(id,'fill-color',C.build);
      else if(t==='line'&&/waterway|river/i.test(id))m.setPaintProperty(id,'line-color',C.water);
      else if(t==='line'&&/casing|outline/i.test(id))m.setPaintProperty(id,'line-color',C.casing);
      else if(t==='line'&&/motorway|trunk/i.test(id))m.setPaintProperty(id,'line-color',C.hw);
      else if(t==='line'&&/primary|secondary|tertiary|minor|street|service|road|link/i.test(id)&&!/rail|transit|path|pedestrian|track/i.test(id))m.setPaintProperty(id,'line-color',C.road);
    }catch(e){}
    try{
      if(t==='symbol'){
        const tf=m.getLayoutProperty(id,'text-field');
        if(tf&&JSON.stringify(tf).indexOf('name')>-1)m.setLayoutProperty(id,'text-field',['coalesce',['get','name:pl'],['get','name:latin'],['get','name:en'],['get','name']]);
      }
    }catch(e){}
  });
}
const VECNAME='Wektorowa, styl Google (OpenFreeMap + polskie nazwy)';
let vecLayer=null,layersCtl=null,vecOK=false;
const makeVec=()=>L.maplibreGL({style:'https://tiles.openfreemap.org/styles/liberty',attribution:'&copy; OpenMapTiles, &copy; OpenStreetMap, OpenFreeMap'});
function applyVec(v){
  const m=v&&v.getMaplibreMap&&v.getMaplibreMap();if(!m)return;
  const run=()=>{try{googleize(m)}catch(e){}};run();m.once('idle',run);
  try{const cv=m.getCanvas();if(cv&&!cv.__azja){cv.__azja=1;cv.addEventListener('webglcontextlost',()=>{setTimeout(()=>{if(vecLost())rebuildVec()},1500)})}}catch(e){}
}
function vecLost(){
  try{const m=vecLayer&&vecLayer.getMaplibreMap&&vecLayer.getMaplibreMap();if(!m)return false;
    const cv=m.getCanvas(),gl=cv&&(cv.getContext('webgl2')||cv.getContext('webgl'));return !!(gl&&gl.isContextLost&&gl.isContextLost())}catch(e){return false}
}
function rebuildVec(){
  if(!vecLayer||!layersCtl)return;
  const was=map.hasLayer(vecLayer);
  try{map.removeLayer(vecLayer)}catch(e){}
  try{layersCtl.removeLayer(vecLayer)}catch(e){}
  try{
    vecLayer=makeVec();base[VECNAME]=vecLayer;layersCtl.addBaseLayer(vecLayer,VECNAME);
    if(was){vecLayer.addTo(map);setTimeout(()=>applyVec(vecLayer),0);setTimeout(()=>applyVec(vecLayer),1500)}
  }catch(e){base['Ulice, styl Google (Esri + filtr)'].addTo(map)}
}
if(typeof L.maplibreGL==='function'&&WEBGL){
  try{
    vecLayer=makeVec();base[VECNAME]=vecLayer;
    map.on('baselayerchange',e=>{if(e.layer===vecLayer)setTimeout(()=>applyVec(vecLayer),0)});
    vecLayer.addTo(map);setTimeout(()=>applyVec(vecLayer),0);setTimeout(()=>applyVec(vecLayer),1500);
    vecOK=true;
  }catch(e){vecOK=false;vecLayer=null}
}
if(!vecOK)base['Ulice, styl Google (Esri + filtr)'].addTo(map);
layersCtl=L.control.layers(base,null,{position:'bottomright'}).addTo(map);

const WXL=[0,0,0,0,0,1,2,3,1,4,4,5,4,6,6,7,6,8,6];
let WXD=[],WXT=0;
const wxDate=i=>'2026-'+D[i].d.slice(3,5)+'-'+D[i].d.slice(0,2);
const wIcon=c=>c===0?'☀️':c<=2?'🌤️':c===3?'☁️':c<=48?'🌫️':c<=57?'🌦️':c<=67?'🌧️':c<=77?'🌨️':c<=82?'🌧️':c<=86?'🌨️':'⛈️';

function paintWx(){
  document.querySelectorAll('.wx').forEach(el=>{
    const i=+el.dataset.d,w=WXD[i],c=el.dataset.c==='1';
    if(!w){el.innerHTML=c?'':'Pogoda: ładowanie…';return}
    const t=Math.round(w.tx)+'°/'+Math.round(w.tn)+'°',city=LOCS[WXL[i]]?LOCS[WXL[i]][2]:'';

    else el.innerHTML=c?'≈ '+t:'≈ <b>'+t+'</b> · typowo dla: '+city+' (średnia z lat 2021–2025), dni z deszczem ok. '+Math.round(w.p)+'%<small>Prognoza pojawi się, gdy data wejdzie w zasięg 16 dni.</small>';

async function loadClim(need){
  const la=LOCS.map(l=>l[0]).join(','),lo=LOCS.map(l=>l[1]).join(','),years=[2021,2022,2023,2024,2025];
  const rs=await Promise.all(years.map(y=>fetch('https://archive-api.open-meteo.com/v1/archive?latitude='+la+'&longitude='+lo+'&start_date='+y+'-10-23&end_date='+y+'-11-10&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto').then(r=>r.ok?r.json():null).catch(()=>null)));
  need.forEach(i=>{
    let n=0,tx=0,tn=0,rain=0;const md=wxDate(i).slice(5);
    rs.forEach((j,yi)=>{if(!j)return;const arr=Array.isArray(j)?j:[j],o=arr[WXL[i]]&&arr[WXL[i]].daily;if(!o)return;
      const x=o.time.indexOf(years[yi]+'-'+md);if(x<0||o.temperature_2m_max[x]==null)return;
      n++;tx+=o.temperature_2m_max[x];tn+=o.temperature_2m_min[x];if((o.precipitation_sum[x]||0)>=1)rain++});
    if(n)WXD[i]={k:'t',tx:tx/n,tn:tn/n,p:100*rain/n,c:null};
  });
}
async function loadWx(){
  try{const c=JSON.parse(localStorage.getItem('azjaWx1')||'null');if(c&&c.d){WXD=c.d;WXT=c.t;paintWx()}}catch(e){}
  const la=LOCS.map(l=>l[0]).join(','),lo=LOCS.map(l=>l[1]).join(',');
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+la+'&longitude='+lo+'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=16&timezone=auto',{cache:'no-store'});
    if(r.ok){
      const j=await r.json(),arr=Array.isArray(j)?j:[j];
      D.forEach((d,i)=>{const o=arr[WXL[i]]&&arr[WXL[i]].daily;if(!o)return;const x=o.time.indexOf(wxDate(i));
        if(x>-1&&o.temperature_2m_max[x]!=null)WXD[i]={k:'f',tx:o.temperature_2m_max[x],tn:o.temperature_2m_min[x],p:o.precipitation_probability_max[x],c:o.weather_code[x]}});
      WXT=Date.now();
    }
  }catch(e){}
  const need=D.map((d,i)=>i).filter(i=>!WXD[i]||WXD[i].k!=='f');
  if(need.length){try{await loadClim(need)}catch(e){}}
  paintWx();
  try{localStorage.setItem('azjaWx1',JSON.stringify({t:WXT,d:WXD}))}catch(e){}
}

 tr:[['22.10','Warszawa → Pekin → Tokio (Haneda)',15557],['28.10','Shinkansen Tokio → Osaka',1792],['01.11','Osaka → Szanghaj',2942],['05.11','Szanghaj → Hongkong',1959],['10.11','Hongkong → Doha → Warszawa',8567]],
 lo:[['Tokio',3600,5,0],['Osaka',2070,4,5],['Szanghaj',1870,4,9],['Hongkong / Shenzhen',3913,5,13]]};
const zl=n=>Math.round(n).toLocaleString('pl-PL')+' zł';
function openCost(){
  const T=COST.tr.reduce((a,x)=>a+x[2],0),Lg=COST.lo.reduce((a,x)=>a+x[1],0),all=T+Lg,night={},tr={};
  COST.lo.forEach(l=>{for(let j=0;j<l[2];j++)night[l[3]+j]=l[1]/l[2]});
  COST.tr.forEach(x=>{const i=D.findIndex(d=>d.d===x[0]);tr[i]=(tr[i]||0)+x[2]});
  const row=(d,c,a,b)=>'<tr><td>'+d+'</td><td>'+c+'<small>'+(a?'transport '+zl(a):'')+(a&&b?' · ':'')+(b?'nocleg ok. '+zl(b):'')+'</small></td><td class="r">'+zl(a+b)+'</td></tr>';
  let h='<div class="bar"><button onclick="closeCost()">&lsaquo; Wróć</button><b>Koszty wyjazdu</b></div><div class="in">';
  h+='<div class="big"><div>Razem</div><b>'+zl(all)+'</b><div>Na osobę ('+COST.ppl+' os.): <b>'+zl(all/COST.ppl)+'</b></div></div>';
  h+='<div style="color:#555;font-size:12px">Dane z arkusza (transport i noclegi). Waluty w arkuszu nie ma, więc przyjąłem złote. Koszt na osobę to suma podzielona przez '+COST.ppl+'.</div>';
  h+='<h4>Transport</h4><table>'+COST.tr.map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+'</td><td class="r">'+zl(x[2])+'</td></tr>').join('')+'<tr class="tot"><td></td><td>Razem transport</td><td class="r">'+zl(T)+'</td></tr></table>';
  h+='<h4>Noclegi</h4><table>'+COST.lo.map(l=>'<tr><td>'+l[0]+'</td><td>'+l[2]+' nocy<small>ok. '+zl(l[1]/l[2])+' za noc</small></td><td class="r">'+zl(l[1])+'</td></tr>').join('')+'<tr class="tot"><td></td><td>Razem noclegi</td><td class="r">'+zl(Lg)+'</td></tr></table>';
  h+='<h4>Dzień po dniu</h4><table>'+row('22.10','Wylot z Warszawy',tr[-1]||0,0)+D.map((d,i)=>row(d.d,d.c,tr[i]||0,night[i]||0)).join('')+'<tr class="tot"><td></td><td>Razem</td><td class="r">'+zl(all)+'</td></tr></table>';
  h+='<h4>Status rezerwacji (z arkusza)</h4><table><tr><td>&#10003;</td><td>Bilety Szanghaj – Hongkong</td></tr><tr><td>&#10003;</td><td>Bilety na shinkansen</td></tr><tr><td>&#9744;</td><td>Bilety Szanghaj – Suzhou (do kupienia)</td></tr><tr><td>&#10003;</td><td>Noclegi: Tokio, Osaka, Szanghaj, Hongkong / Shenzhen</td></tr></table></div>';
  const c=document.getElementById('cost');c.innerHTML=h;c.classList.add('on');c.scrollTop=0;
}
function closeCost(){document.getElementById('cost').classList.remove('on')}

// ===== Przeciąganie panelu (3 pozycje) =====
(function(){
  const grip=document.getElementById('grip'),side=document.getElementById('side');
  if(!grip||!side||!grip.addEventListener)return;
  const ORDER=['min','mid','full'];
  let drag=false,moved=false,sy=0,sh0=0,t0=0,start='mid',pid=null;
  const hs=()=>({min:Math.max(88,innerHeight*.105),mid:innerHeight*.34,full:innerHeight*.9});
  const stateFor=h=>{const r=hs();return h<(r.min+r.mid)/2?'min':h<(r.mid+r.full)/2?'mid':'full'};
  grip.addEventListener('pointerdown',e=>{
    if(!isMob())return;
    drag=true;moved=false;sy=e.clientY;t0=Date.now();start=sheet;sh0=side.getBoundingClientRect().height;pid=e.pointerId;
    try{grip.setPointerCapture(pid)}catch(_){}
    side.style.transition='none';
  });
  grip.addEventListener('pointermove',e=>{
    if(!drag)return;
    const dy=sy-e.clientY;if(Math.abs(dy)>6)moved=true;if(!moved)return;
    if(e.preventDefault)e.preventDefault();
    const r=hs(),h=Math.max(r.min,Math.min(r.full,sh0+dy));
    document.body.style.setProperty('--sh',h+'px');
    const k=stateFor(h);if(k!==sheet)setSheetClass(k);
  });
  const end=e=>{
    if(!drag)return;drag=false;
    try{grip.releasePointerCapture(pid)}catch(_){}
    side.style.transition='';
    if(!moved){cycleSheet();return}
    const h=side.getBoundingClientRect().height,v=(sy-e.clientY)/Math.max(1,Date.now()-t0);
    let k=stateFor(h);
    if(k===start&&Math.abs(v)>0.4){const i=ORDER.indexOf(start)+(v>0?1:-1);k=ORDER[Math.max(0,Math.min(2,i))]}
    document.body.style.removeProperty('--sh');
    setSheet(k);
  };
  grip.addEventListener('pointerup',end);
  grip.addEventListener('pointercancel',end);
})();

// ===== Odświeżenie mapy po powrocie z innej aplikacji =====
function revive(){
  try{if(window.__swr)window.__swr.update()}catch(e){}
  try{setH();map.invalidateSize(true)}catch(e){}
  try{map.eachLayer(l=>{if(l.redraw&&l._url)l.redraw()})}catch(e){}
  try{
    if(vecLayer){
      if(vecLost())rebuildVec();
      else{const m=vecLayer.getMaplibreMap&&vecLayer.getMaplibreMap();if(m){m.resize();m.triggerRepaint()}if(vecLayer._update)vecLayer._update()}
    }
  }catch(e){}
  if(lastFit)setTimeout(()=>{try{map.invalidateSize(true)}catch(e){}},300);
}
if(typeof document.addEventListener==='function'){
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(revive,150)});
}
addEventListener('pageshow',()=>setTimeout(revive,150));
addEventListener('focus',()=>setTimeout(revive,250));

 SLOT.map((c,i)=>'<span><em style="background:'+c+(i===3?';border:2px solid #fca311':'')+'"></em>'+SLOTN[i]+'</span> ').join('')+'<span>Białe kółka na trasie: przystanki i przesiadki</span> <span>Pogoda: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo.com</a></span> <span>Wersja 12</span>')+'</div>';
if(innerWidth<=800)lg.classList.add('closed');
showAll();
if(isMob())setSheet('full');
loadWx();
morningCheck();
if(typeof navigator!=='undefined'&&'serviceWorker' in navigator&&typeof location!=='undefined'&&location.protocol.indexOf('http')===0){
  const hadSW=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW&&!reloaded){reloaded=true;location.reload()}});
  addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(r=>{window.__swr=r}).catch(()=>{})});
}
