:root{--b:#14213d;--o:#fca311;--g:#e5e5e5;--k:#000}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;display:flex;height:100vh;color:#000;background:#fff}
#side{width:380px;display:flex;flex-direction:column;background:#fff;border-right:3px solid var(--o)}
header{background:var(--b);color:#fff;padding:10px 12px;font-size:15px;font-weight:bold;border-bottom:3px solid var(--o)}
header small{display:block;font-weight:normal;opacity:.8;font-size:11px}
#nav{padding:8px;border-bottom:1px solid var(--g)}
#nav .row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
#nav .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--b);font-weight:bold;margin:2px 0 3px;width:100%}
button{font:inherit;font-size:11px;border:1px solid var(--b);background:#fff;color:var(--b);border-radius:5px;padding:4px 7px;cursor:pointer;line-height:1.25}
button:hover{background:var(--g)}
button.on{background:var(--b);border-color:var(--b);color:#fff}
button.g{border:1px solid var(--o);color:#000;box-shadow:inset 0 -3px 0 var(--o)}
button.g.on{background:var(--o);color:#000;border-color:var(--o)}
#info{flex:1;overflow:auto;padding:12px;font-size:13px}
#info h2{margin:0;font-size:17px;color:var(--b)}
.sub{color:#333;margin:2px 0 10px;font-size:12px}
.stop{display:flex;gap:8px;padding:6px;border-radius:6px;cursor:pointer}
.stop:hover{background:var(--g)}
.stop i{flex:none;width:24px;height:24px;border-radius:50%;font-style:normal;font-size:12px;font-weight:bold;display:flex;align-items:center;justify-content:center}
.stop small{display:block;color:#444;font-size:12px}
.leg{margin:2px 0 2px 14px;padding:5px 8px;border-left:4px solid;background:var(--g);font-size:12px;border-radius:0 5px 5px 0}
.leg b{font-size:11px}
.leg a{color:var(--b);font-weight:bold;font-size:11px}
#legend .lgt{cursor:pointer;font-weight:500;color:var(--b)}
#legend.closed .items{display:none}
#legend{padding:7px 12px;border-top:1px solid var(--g);font-size:11px;line-height:1.8}
#legend span{margin-right:9px;white-space:nowrap}
#legend u{display:inline-block;width:22px;border-top:3px solid;vertical-align:middle;margin-right:3px;text-decoration:none}
#legend em{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px;vertical-align:middle}
#map{flex:1}
.pin{border-radius:50%;font-weight:bold;border:2px solid #fff;box-shadow:0 1px 4px #0008;display:flex;align-items:center;justify-content:center}
.leaflet-tooltip{white-space:normal;max-width:250px;border-color:var(--b);font-size:12px}
.leaflet-tooltip b{color:var(--b)}
@media(max-width:800px){body{flex-direction:column-reverse}#side{width:100%;height:48vh}#map{height:52vh;flex:none}}

/* ===== Filtry podkładu (przybliżenie palety Google) ===== */
.t-google{filter:saturate(.82) brightness(1.05) contrast(.93)}
.t-osmg{filter:saturate(.72) brightness(1.05) contrast(.95)}
/* ===== Nakładka w stylu Google Maps ===== */
body{font-family:Roboto,Arial,sans-serif;display:block;position:relative;overflow:hidden}
#map{position:absolute;inset:0;z-index:1}
#side{position:absolute;z-index:1100;top:12px;left:12px;bottom:12px;width:392px;border:0;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.18);overflow:hidden}
header{background:#fff;color:#000;border-bottom:1px solid var(--g);padding:14px 16px 10px;font-size:18px;font-weight:500}
header::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--o);margin-right:8px}
header small{color:#555;font-size:12px;margin-top:3px;font-weight:400}
#nav{background:#fff}
button{border-radius:16px;padding:5px 11px;font-size:12px;border-color:#c9c9c9;color:#000;background:#fff}
button:hover{background:var(--g)}
button.on{background:var(--b);border-color:var(--b);color:#fff}
button.g{border:1px solid #c9c9c9;box-shadow:none}
button.g.on{background:var(--b);color:#fff;border-color:var(--b)}
#info h2{font-weight:500;font-size:19px}
.stop{border-radius:8px;padding:8px}
.leg{background:#fff;border:1px solid var(--g);border-left-width:5px;border-radius:8px;margin:4px 0 4px 10px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.leaflet-control-zoom,.leaflet-control-layers{border:0!important;border-radius:10px!important;box-shadow:0 1px 4px rgba(0,0,0,.35)!important}
.leaflet-control-zoom a{color:#222!important}
.leaflet-control-layers{padding:2px 4px}
.leaflet-tooltip{border:0;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.3);padding:8px 10px;font-family:Roboto,Arial,sans-serif}
.leaflet-popup-content-wrapper{border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.leaflet-control-attribution{font-size:10px}
.gpin{position:relative;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.gpin span{position:absolute;left:0;right:0;text-align:center;font-weight:700;font-family:Roboto,Arial,sans-serif}
@media(max-width:800px){#side{top:auto;left:0;right:0;bottom:0;width:100%;height:46vh;border-radius:16px 16px 0 0}}
</style>

 ['Terminal promowy Macau (powrót)',22.1959,113.5538,2,'Wieczorem powrót do Hongkongu',['b','Autobus miejski lub taxi, ok. 20 min']],
 ['Terminal promowy HK–Macau (powrót)',22.2878,114.1522,2,'Prom do Hongkongu (Victoria Harbour)',['fe','Prom ok. 1h']]]},
{d:'08.11',c:'Hongkong',t:'Tramwaj, muzeum, Ladies Market',s:[
 N('hk','Kościół'),
 ['Western Market (Sheung Wan)',22.2878,114.1495,0,'Start przejazdu tramwajem po wyspie',['t','Tsuen Wan Line → Admiralty, Island Line → Sheung Wan, ok. 35 min','admi']],
 ['Causeway Bay',22.2800,114.1855,0,'Tramwaj piętrowy',['tr','Tramwaj ok. 40 min']],
 ['Hong Kong Museum of Art',22.2935,114.1722,1,'Obiad na wyspie, muzeum sztuki lub historii',['t','MTR Causeway Bay → Admiralty → Tsuen Wan Line → Tsim Sha Tsui, ok. 25 min','admi']],
 ['Ladies Market',22.3190,114.1707,2,'Zakupy, kolacja gdzieś',['t','Tsuen Wan Line TST → Mong Kok, ok. 6 min']]]},
{d:'09.11',c:'Shenzhen',t:'Shenzhen – obrazy',s:[
 N('hk','Pobudka, wyjście'),
 ['Dafen Oil Painting Village',22.6056,114.1426,1,'Metro do Luohu, przejazd do Dafen, kupowanie obrazów, zwiedzanie Shenzhen (miejsce przybliżone)',['t','MTR East Rail → Lo Wu, granica, metro Shenzhen: Luohu → Line 1 → Laojie → Line 3 → Dafen, ok. 2h','lowu','laojie']],
 N('hk','Przejazd do hotelu w HK',['t','Metro Line 3 → Laojie → Line 1 → Luohu, granica Lo Wu, MTR (Google Maps) → Mei Foo, ok. 2h','laojie','lowu'])]},
{d:'10.11',c:'Hongkong → Warszawa',t:'Powrót do Polski',s:[
 N('hk','Wymeldowanie'),
 ['Lotnisko Hong Kong (HKG)',22.3080,113.9185,1,'Wylot 18:40, przesiadka w Doha, WAW 11.11 o 6:40',['t','Tsuen Wan → Lai King, Tung Chung → Tsing Yi, Airport Express, ok. 50 min','laiking','tsingyi']]]}
];
const GR=[
 {n:'Tokio',c:H.tk,d:[0,1,2,3,4,5]},
 {n:'Osaka, Kioto, Nara',c:H.os,d:[5,6,7,8,9]},
 {n:'Szanghaj, Suzhou',c:H.sh,d:[9,10,11,12,13]},
 {n:'Hongkong, Makau, Shenzhen',c:H.hk,d:[13,14,15,16,17,18]}];

const km=(a,b)=>{const r=Math.PI/180,x=(b[2]-a[2])*r*Math.cos((a[1]+b[1])*r/2),y=(b[1]-a[1])*r;return 6371*Math.sqrt(x*x+y*y)};
const gm=(a,b,m)=>'https://www.google.com/maps/dir/?api=1&origin='+a[1]+','+a[2]+'&destination='+b[1]+','+b[2]+'&travelmode='+(m==='w'?'walking':'transit');
const esc=s=>s.replace(/</g,'&lt;');

const map=L.map('map',{zoomControl:false});
L.control.zoom({position:'bottomright'}).addTo(map);
const ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/';
const base={
 'Ulice, styl Google (Esri + filtr)':L.tileLayer(ESRI+'World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,className:'t-google',attribution:'Tiles &copy; Esri'}),
 'OpenStreetMap, styl Google (filtr)':L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,className:'t-osmg',attribution:'&copy; OpenStreetMap contributors'}),
 'Ulice (Esri, oryginał)':L.tileLayer(ESRI+'World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri'}),
 'Jasna szara (Esri)':L.tileLayer(ESRI+'Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:16,maxZoom:19,attribution:'Tiles &copy; Esri'}),
 'Satelita (Esri)':L.tileLayer(ESRI+'World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri'})
};
// Mapa wektorowa OpenFreeMap przemalowana na kolory zbliżone do Google (eksperymentalna)
function googleize(m){
  const C={bg:'#f5f3ee',water:'#aadaff',park:'#c9e8c0',build:'#e9e5dc',hw:'#fdd88a',road:'#ffffff',casing:'#e0dcd2'};
  m.getStyle().layers.forEach(l=>{
    const id=l.id,t=l.type;
    try{
      if(t==='background')m.setPaintProperty(id,'background-color',C.bg);
      else if(t==='fill'&&/water/i.test(id))m.setPaintProperty(id,'fill-color',C.water);
      else if(t==='fill'&&/park|wood|forest|grass|green|garden|pitch|cemetery|nature/i.test(id))m.setPaintProperty(id,'fill-color',C.park);
      else if(t==='fill'&&/building/i.test(id))m.setPaintProperty(id,'fill-color',C.build);
      else if(t==='line'&&/waterway|river/i.test(id))m.setPaintProperty(id,'line-color',C.water);
      else if(t==='line'&&/casing|outline/i.test(id))m.setPaintProperty(id,'line-color',C.casing);
      else if(t==='line'&&/motorway|trunk/i.test(id))m.setPaintProperty(id,'line-color',C.hw);
      else if(t==='line'&&/primary|secondary|tertiary|minor|street|service|road|link/i.test(id)&&!/rail|transit|path|pedestrian|track/i.test(id))m.setPaintProperty(id,'line-color',C.road);
    }catch(e){}
    try{
      if(t==='symbol'){
        const tf=m.getLayoutProperty(id,'text-field');
        if(tf&&JSON.stringify(tf).indexOf('name')>-1)m.setLayoutProperty(id,'text-field',['coalesce',['get','name:pl'],['get','name:latin'],['get','name:en'],['get','name']]);
      }
    }catch(e){}
  });
}
const VECNAME='Wektorowa, styl Google (OpenFreeMap + polskie nazwy)';
let vecOK=false;
if(typeof L.maplibreGL==='function'){
  try{
    const vec=L.maplibreGL({style:'https://tiles.openfreemap.org/styles/liberty',attribution:'&copy; OpenMapTiles, &copy; OpenStreetMap, OpenFreeMap'});
    const apply=()=>{const m=vec.getMaplibreMap&&vec.getMaplibreMap();if(!m)return;const run=()=>{try{googleize(m)}catch(e){}};run();m.once('idle',run)};
    base[VECNAME]=vec;
    map.on('baselayerchange',e=>{if(e.layer===vec)setTimeout(apply,0)});
    vec.addTo(map);setTimeout(apply,0);setTimeout(apply,1500);
    vecOK=true;
  }catch(e){vecOK=false}
}
if(!vecOK)base['Ulice, styl Google (Esri + filtr)'].addTo(map);
L.control.layers(base,null,{position:'bottomright'}).addTo(map);
const layer=L.layerGroup().addTo(map);let mk=[];

const pin=(txt,col,sz,fg,bd)=>{const h=Math.round(sz*1.35);return L.divIcon({className:'',html:'<div class="gpin" style="width:'+sz+'px;height:'+h+'px"><svg width="'+sz+'" height="'+h+'" viewBox="0 0 24 32"><path d="M12 1C5.9 1 1 5.9 1 12c0 8.3 11 19 11 19s11-10.7 11-19C23 5.9 18.1 1 12 1z" fill="'+col+'" stroke="'+(bd||'#fff')+'" stroke-width="'+(bd?2.4:1.6)+'"/></svg><span style="top:'+Math.round(sz*.22)+'px;color:'+(fg||'#fff')+';font-size:'+(sz>28?14:sz>24?12:10)+'px;line-height:'+Math.round(sz*.5)+'px">'+txt+'</span></div>',iconSize:[sz,h],iconAnchor:[sz/2,h],popupAnchor:[0,-h],tooltipAnchor:[sz/2,-h*.55]})};
const fit=(pts,max)=>{const w=innerWidth>800;map.fitBounds(pts,{paddingTopLeft:[w?430:40,50],paddingBottomRight:[50,w?50:Math.round(innerHeight*.5)],maxZoom:max||18})};
const home=sz=>pin('&#8962;','#fff',sz,'#14213d','#fca311');
const tip=(day,s)=>'<b>'+esc(s[0])+'</b><br>'+day.d+' · '+SLOTN[s[3]]+(s[4]?'<br>'+esc(s[4]):'');

function leg(day,p,s,col,thin,dash){
  const l=s[5];if(!l)return;const md=MODES[l[0]];
  const via=l.slice(2).map(k=>S[k]);
  const pts=[[p[1],p[2]],...via.map(v=>[v[0],v[1]]),[s[1],s[2]]];
  const line=L.polyline(pts,{color:col||md[1],weight:thin?3:(l[0]==='s'?6:4),opacity:.9,dashArray:thin?(dash||null):md[2]}).addTo(layer);
  line.bindTooltip('<b>'+md[0]+'</b>: '+esc(p[0])+' → '+esc(s[0])+'<br>'+esc(l[1]),{sticky:true});
  if(!thin)via.forEach(v=>L.circleMarker([v[0],v[1]],{radius:6,color:md[1],weight:3,fillColor:'#fff',fillOpacity:1}).bindTooltip('<b>Przystanek / przesiadka</b><br>'+v[2]).addTo(layer));
}

function setNav(cur){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===cur));
}

function showAll(){
  layer.clearLayers();mk=[];setNav('all');const all=[];
  D.forEach((day,i)=>{
    const pts=day.s.map(s=>[s[1],s[2]]);
    if(day.c.indexOf('→')<0&&pts.length>1)L.polyline(pts,{color:PAL[i%3],weight:3,opacity:.7}).addTo(layer);
    day.s.forEach(s=>all.push([s[1],s[2]]));
  });
  const route=[[H.tk,H.os,'s'],[H.os,H.sh,'f'],[H.sh,H.hk,'f']];
  route.forEach(r=>L.polyline([[r[0][1],r[0][2]],[r[1][1],r[1][2]]],{color:MODES[r[2]][1],weight:r[2]==='s'?6:4,dashArray:MODES[r[2]][2],opacity:.9}).bindTooltip(MODES[r[2]][0]+': '+r[0][0]+' → '+r[1][0],{sticky:true}).addTo(layer));
  Object.values(H).forEach(h=>L.marker([h[1],h[2]],{icon:home(30)}).bindTooltip('<b>'+h[0]+'</b><br>'+h[3]).addTo(layer));
  fit(Object.values(H).map(h=>[h[1],h[2]]).concat([[34.4,135.2],[22.3,113.9]]));
  const info=document.getElementById('info');
  info.innerHTML='<h2>Cała trasa</h2><div class="sub">Tokio → Osaka (shinkansen) → Szanghaj → Hongkong → Warszawa</div>'+
   GR.map((g,k)=>'<div class="stop" onclick="showGroup('+k+')"><i style="background:var(--b);color:#fff;width:auto;padding:0 8px;border-radius:12px">'+g.n+'</i><div><small>Zobacz cały pobyt</small></div></div>').join('')+
   '<div class="sub" style="margin-top:12px">Linie: shinkansen (gruba czarna), loty (czarna przerywana). Szczegóły przejazdów w widoku dnia.</div>';
}

function showGroup(k){
  layer.clearLayers();mk=[];setNav('g'+k);const g=GR[k],pts=[];
  let html='<h2>'+g.n+'</h2><div class="sub">Cały pobyt – kolor oznacza dzień, kliknij dzień, aby zobaczyć szczegóły i przejazdy</div>';
  g.d.forEach((di,j)=>{
    const day=D[di],col=PAL[j%3],dash=j>=3?'8 6':null,fg=col==='#fca311'?'#000':'#fff';let prev=null;
    html+='<div class="stop" onclick="showDay('+di+')"><i style="background:'+col+';color:'+fg+';width:auto;padding:0 7px;border-radius:12px">'+day.d+'</i><div>'+day.t+'<small>'+day.s.filter(s=>s[3]<3).length+' punktów</small></div></div>';
    day.s.forEach((s,n)=>{
      if(km(g.c,s)>120){prev=null;return;}
      if(prev&&s[5])leg(day,prev,s,col,true,dash);
      prev=s;pts.push([s[1],s[2]]);
      if(s[3]<3)L.marker([s[1],s[2]],{icon:pin(day.d.slice(0,2),col,26,fg)}).bindTooltip(tip(day,s)).addTo(layer);
    });
  });
  L.marker([g.c[1],g.c[2]],{icon:home(32)}).bindTooltip('<b>'+g.c[0]+'</b><br>'+g.c[3]).addTo(layer);
  pts.push([g.c[1],g.c[2]]);fit(pts);
  document.getElementById('info').innerHTML=html;
}

function showDay(i){
  layer.clearLayers();mk=[];setNav('d'+i);
  const day=D[i],pts=[];
  let html='<h2>'+day.d+'.2026 · '+day.c+'</h2><div class="sub">'+day.t+'</div>',prev=null,num=0;
  day.s.forEach((s,k)=>{
    const ll=[s[1],s[2]];pts.push(ll);
    if(prev&&s[5]){
      leg(day,prev,s,null,false);const md=MODES[s[5][0]];
      html+='<div class="leg" style="border-color:'+md[1]+'"><b style="color:'+md[1]+'">'+md[0]+'</b> · '+esc(s[5][1])+
        (s[5][0]!=='f'?' <a href="'+gm(prev,s,s[5][0])+'" target="_blank" rel="noopener">trasa w Google Maps &rarr;</a>':'')+'</div>';
    }
    const lab=s[3]===3?'&#8962;':++num;
    const m=L.marker(ll,{icon:s[3]===3?home(32):pin(lab,SLOT[s[3]],30,SLOTT[s[3]])}).addTo(layer).bindTooltip(tip(day,s)).bindPopup('<b>'+esc(s[0])+'</b><br>'+SLOTN[s[3]]+(s[4]?'<br>'+esc(s[4]):''));
    mk.push(m);
    html+='<div class="stop" onclick="focusStop('+k+')"><i style="background:'+SLOT[s[3]]+';color:'+SLOTT[s[3]]+(s[3]===3?';border:2px solid #fca311':'')+'">'+lab+'</i><div>'+esc(s[0])+'<small>'+SLOTN[s[3]]+(s[4]?' · '+esc(s[4]):'')+'</small></div></div>';
    prev=s;
  });
  document.getElementById('info').innerHTML=html;
  const far=pts.length>1&&km(day.s[0],day.s[day.s.length-1])>120;
  fit(pts,far?6:15);
}
function focusStop(k){map.setView(mk[k].getLatLng(),Math.max(map.getZoom(),15));mk[k].openPopup()}

const nav=document.getElementById('nav');
nav.innerHTML='<div class="lbl">Widok pobytu</div><div class="row"><button data-k="all" class="g" onclick="showAll()">Cała trasa</button>'+
 GR.map((g,k)=>'<button data-k="g'+k+'" class="g" onclick="showGroup('+k+')">'+g.n+'</button>').join('')+'</div>'+
 '<div class="lbl">Pojedynczy dzień</div><div class="row">'+D.map((d,i)=>'<button data-k="d'+i+'" onclick="showDay('+i+')"><b>'+d.d+'</b> '+d.c.split(' ')[0]+'</button>').join('')+'</div>';
const lg=document.getElementById('legend');
lg.innerHTML='<div class="lgt" onclick="this.parentNode.classList.toggle(\'closed\')">Legenda &#9662;</div><div class="items">'+(Object.values(MODES).map(m=>'<span><u style="border-color:'+m[1]+';border-top-style:'+(m[2]?(m[2].charAt(0)==='2'?'dotted':'dashed'):'solid')+'"></u>'+m[0]+'</span> ').join('')+'<br>'+
 SLOT.map((c,i)=>'<span><em style="background:'+c+(i===3?';border:2px solid #fca311':'')+'"></em>'+SLOTN[i]+'</span> ').join('')+'<span>Białe kółka na trasie: przystanki i przesiadki</span>')+'</div>';
if(innerWidth<=800)lg.classList.add('closed');
showAll();
</script>
